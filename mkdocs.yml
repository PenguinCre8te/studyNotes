site_name: Project Documentation
site_description: Documentation generated from multiple directories.
site_url: https://penguincre8te.github.io/studyNotes/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - tables
