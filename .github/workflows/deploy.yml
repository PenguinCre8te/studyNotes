name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main # Or 'master' depending on your default branch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install mkdocs mkdocs-material

      - name: Gather Markdown Files from All Directories
        run: |
          python -c "
          import os
          import shutil
          from pathlib import Path

          os.makedirs('docs', exist_ok=True)

          # Find all .md files across the repo, excluding existing docs, site, or hidden folders
          for path in Path('.').rglob('*.md'):
              if 'docs' in path.parts or 'site' in path.parts or any(p.startswith('.') for p in path.parts):
                  continue
              
              dest = Path('docs') / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy(path, dest)
              print(f'Copied: {path} -> {dest}')
          "

      - name: Auto-generate Nested Index.md
        run: |
          python -c "
          from pathlib import Path

          docs_dir = Path('docs')
          files = [p for p in docs_dir.rglob('*.md') if p.relative_to(docs_dir) != Path('index.md')]

          # Build a nested dictionary tree structure
          tree = {}
          for file_path in files:
              parts = file_path.relative_to(docs_dir).parts
              current = tree
              for part in parts[:-1]:
                  current = current.setdefault(part, {})
              current[parts[-1]] = file_path

          def build_markdown_tree(node, indent=0):
              lines = []
              dirs = sorted([k for k, v in node.items() if isinstance(v, dict)])
              fls = sorted([k for k, v in node.items() if not isinstance(v, dict)])
              
              prefix = '  ' * indent
              for d in dirs:
                  lines.append(f'{prefix}- **{d.replace(\"_\", \" \").title()}**')
                  lines.extend(build_markdown_tree(node[d], indent + 1))
                  
              for f in fls:
                  file_path = node[f]
                  rel_path = file_path.relative_to(docs_dir)
                  title = file_path.stem.replace('_', ' ').title()
                  lines.append(f'{prefix}- [{title}]({rel_path.as_posix()})')
                  
              return lines

          lines = ['# Documentation Index\n', 'Index of all study notes:\n']
          lines.extend(build_markdown_tree(tree))

          index_path = docs_dir / 'index.md'
          index_path.write_text('\n'.join(lines), encoding='utf-8')
          print('Generated docs/index.md successfully with a nested directory structure.')
          "

      - name: Build Documentation
        run: |
          mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
