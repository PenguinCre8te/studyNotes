name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main # Or 'master' depending on your default branch

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install mkdocs mkdocs-material

      - name: Gather Markdown Files from All Directories
        run: |
          python -c "
          import os
          import shutil
          from pathlib import Path

          os.makedirs('docs', exist_ok=True)

          # Find all .md files across the repo, excluding existing docs, site, or hidden folders
          for path in Path('.').rglob('*.md'):
              if 'docs' in path.parts or 'site' in path.parts or any(p.startswith('.') for p in path.parts):
                  continue
              
              dest = Path('docs') / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy(path, dest)
              print(f'Copied: {path} -> {dest}')
          "

      - name: Build Documentation
        run: |
          mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
